<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Curso pratica Viola | Clássica Academy</title>
    <link rel="stylesheet" href="syles/header.css">
    <link rel="stylesheet" href="syles/cursos.css">
</head>
<body onload="paginacao(paginasPraticaViola)">

<header>
    <div class="nomesite">
        <h2>Clássica Academy - Viola parte instrumental</h2>
    </div>

    <div class="nav">
        <button onclick="navegacaoGlobal('cursosDisponiveis')">Cursos Disponíveis</button>

        <button onclick="navegacaoGlobal('teoria')">Teoria musical</button>

        <button onclick="navegacaoGlobal('pratica')">Teoria instrumental</button>

        <button onclick="navegacaoGlobal('licoes')">Lições</button>

        <button onclick="navegacaoGlobal('dashboard')">Dashboard</button>

        <button onclick="sair()">Sair</button>
    </div>
</header>

<main class="conteudo_curso" >
    <section id="escrita">

        <section id="pagina">
            <h2 id="titulo_pagina"></h2>

            <p id="texto_curso"></p>

            <div id="div_imagem"></div>

            <div id="passador">
                <button id="voltar" onclick="mudar(2)">&lt;</button>
                <button id="avancar" onclick="mudar(1)">&gt;</button>
                <button id="terminar" onclick="finalizarCurso()" >Finalizar curso - parte teórica</button>
            </div>
        </section>
    </section>

    <section id="quiz">
        <section id="pagina">
    <div id="infoQuestao" class="padding-8">
                <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de um total de<span id="qtdQuestoes"></span>
            </div>

            <div id="perguntaDaQuestaoAtual" class="padding-8">
                <span id="spanQuestaoExibida" class="text-bold"></span>
            </div>

            
            <div id="infoAlternativas" class="padding-8">
                <span><em>Escolha uma opção dentre as abaixo:</em></span>
            </div>

            <div id="opcoes" class="flex-colunar padding-8">
                <span>
                    <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
                    <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                </span>
                <span>
                    <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
                    <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                </span>
                <span>
                    <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
                    <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                </span>
                <span>
                    <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD" />
                    <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
                </span>
            </div>


            <div id="botoes" class="flex-colunar padding-8">
                <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
                <button onclick="avancar()" id="btnProx" disabled>Avançar para próxima questão</button>
                <button onclick="mostrarResultados()" id="btnVerResultado" disabled>ver resultados</button>
            </div>
        </section>
    </section>


<section id="resultados">
    <section id="pagina">
                <h2>Veja os seus resultados</h2>
                <h3 id="textoParaMensagemFinal"></h3><br>
                <h3 id="pontuacaoFinal"></h3><br>
                <h3 id="acertos"></h3><br>
                <h3 id="erros"></h3><br><br>
                <h4 id="mensagemSucesso"></h4>
                <button id="irdash" onclick="window.location = 'dashboard.html'" >Ver na dashboard</button>

                
            </section>
        </section>

</main>

<script src="../app/dentro_cursos/curso_instrumento_viola.js"></script>
<script src="../app/navegacao.js"></script>
</body>
</html>
