<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cadastro</title>
    <link rel="stylesheet" href="syles/header.css">
    <link rel="stylesheet" href="syles/style_cad_log.css" />
  </head>
  <body>
    <main class="page">
    <header>
        <div class="nomesite">
            <h2>Clássica Academy</h2>
        </div>
        <div class="nav">
            <button><a href="index.html">Início</a></button>
            <button><a href="index.html#conteiner_introducao">Fundamentos</a></button>
            <button><a href="index.html#conteiner_instrumentos">Instrumentos</a></button>
            <button><a href="trajetoria.html">Sobre mim</a></button>
            
        </div>
    </header>

        <section class="card">
          <div class="forms">
          <form id="form_cad" class="form">
            <h2>Cadastro</h2>
          
            <input
              type="text"
              id="imp_user"
              placeholder="Usuario:"
              autocomplete="username"
              required
            />

            <input
              type="email"
              id="imp_email"
              placeholder="Email:"
              autocomplete="email"
              required
            />

           
            <input
              type="password"
              id="imp_senha"
              placeholder="Senha:"
              autocomplete="new-password"
              required
            />

            <input
              type="password"
              id="imp_senhacorfirm"
              placeholder="Confirmar senha:"
              autocomplete="new-password"
              required
            />


            <button type="submit" id="criar">Criar conta</button>
            <p class="msg" id="register-msg" role="status"></p>
          </form>
          </section>
        </div>
      </section>
    </main>

    <script src="app/cadastrar.js"></script>
  </body>
</html>
