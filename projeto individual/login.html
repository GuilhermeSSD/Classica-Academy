<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="syles/header.css">
    <link rel="stylesheet" href="syles/style_cad_log.css" />
  </head>
  <body>
    <main class="page">
      
      <header>
        <div class="nomesite">
            <h2>Clássica Academy</h2>
        </div>
        <div class="nav">
            <button><a href="index.html">Início</a></button>
            <button><a href="index.html#conteiner_introducao">Fundamentos</a></button>
            <button><a href="index.html#conteiner_instrumentos">Instrumentos</a></button>
            <button><a href="trajetoria.html">Sobre mim</a></button>
            
        </div>
    </header>
    <section class="card">
        <div class="forms">
          <form id="register-form" class="form">
            <h2>Login</h2>
            <input
              type="text"
              id="user"
              placeholder="Usuario:"
              autocomplete="username"
              required
            />

            <input
              type="email"
              id="email"
              placeholder="Email:"
              autocomplete="email"
              required
            />

            <input
              type="password"
              id="senha"
              placeholder="Senha:"
              autocomplete="password"
              required
            />



            <button type="submit" id="entrar">Entrar</button>
            <button style="background-color: brown;" onclick="ircad()">Não tem uma conta</button>
            <p class="msg" id="register-msg" role="status"></p>
          </form>
          </section>
        </div>
      </section>
    </main>

    <script src="app/login.js"></script>
  </body>
</html>
